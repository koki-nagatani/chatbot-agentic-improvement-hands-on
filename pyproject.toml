[project]
name = "chatbot-agentic-improvement-hands-on"
version = "0.1.0"
description = "LangGraph RAG chatbot improved by a Flue Improvement Agent"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.50",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
# Local modules are imported by bare name (e.g. `from settings import ...`).
src = ["apps/chatbot", "evals", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
