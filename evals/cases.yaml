- id: hard-agent-safety-multi-aspect
  category: hard
  turns:
    - コーディングエージェントを安全に動かしつつ、品質も担保したいです。サンドボックスの選び方と、AIが書いたコードのレビューの考え方を教えてください。
  reference: >-
    サンドボックス（記事「コーディングエージェントのサンドボックス技術を理解する」）：何を守る必要があるかで選ぶ。
    普段のローカル開発ではツール備え付けのOSネイティブサンドボックス（/sandbox）で十分、エージェントを自律的に長時間走らせるときは
    Docker SandboxなどのMicroVMで完全に分離する。最小権限の原則を守ることが一番確実。
    レビュー（記事「AIコーディングではコードではなく検証プロセスをレビューする」）：デプロイとE2Eテストまでエージェントの責務に含めて検証範囲を広げ、
    レビューは必要・不要の二値ではなくシステムに必要なレビュー水準で考える。人間は仕様や業務ロジックを確認し、コード品質はAIレビューに寄せる。
    両方の観点に答える必要がある。
  checks:
    must_include:
      - [OSネイティブ, Seatbelt, bubblewrap, MicroVM, Docker Sandbox, コンテナ, 最小権限]
      - [E2E, 検証プロセス, レビュー水準, 要求水準, 業務ロジック]
    expected_docs: [3ec9d2d39f446b, 56245f7a34539c]
  criteria: [completeness]

