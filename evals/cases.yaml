# Eval cases for the Matsuo Institute tech blog chatbot.
#
# Fields
#   id         unique id
#   category   easy | normal | hard
#   turns      user messages in order; the last one is evaluated. Earlier turns are
#              answered by the bot itself to build the conversation history.
#   reference  key facts a correct answer should convey (from apps/chatbot/knowledge)
#   checks     deterministic checks (all optional)
#     must_include      list of groups; each group passes if ANY of its strings appears
#     must_not_include  list of regex patterns that must NOT match the answer
#     expected_docs     retrieval passes if any retrieved chunk id starts with one of these
#     max_chars         answer length limit
#   criteria   LLM judge criteria (see graders.py). correctness and groundedness are
#              always judged; list additional ones here.

- id: easy-mcp-intro
  category: easy
  turns:
    - MCP（Model Context Protocol）の基本を解説している記事はありますか？ざっくりどんな仕組みですか？
  reference: >-
    記事「MCP入門」がある。MCPはAIアシスタントが外部のデータやツールにアクセスするための共通のルール（プロトコル）で、
    「AI⇔データやツール」の接続方式を標準化する。共通言語はJSON-RPC 2.0で、最初にinitializeで互いの機能を確認し合い、
    ホスト・クライアント・サーバの3つの役割で構成される。
  checks:
    must_include:
      - [JSON-RPC, ホスト, クライアント, 共通のルール, 標準化]
    expected_docs: [0ed4d02ef3439c]
  criteria: [citation]

- id: easy-uv-docker
  category: easy
  turns:
    - uvとDockerを組み合わせてPython環境を作るとき、松尾研究所のおすすめの方法は？
  reference: >-
    Astral公式のuv+pythonイメージ（uvとPythonが同梱された公式イメージ）を使う方法（パターン1）を推奨している。
    uvのみの公式イメージや公式インストーラ（install.sh）での直接インストールは補足的手段。
    単純な質問なので、推奨方法を端的に答えるのが望ましい。
  checks:
    expected_docs: [3aaa36d6f35c08]
  criteria: [conciseness]

- id: easy-grpo-cartpole
  category: easy
  turns:
    - GRPOをCartPoleで実装する記事のコードを動かすのに、GPUは必要ですか？
  reference: >-
    GPUは不要。実装はPyTorchで、Google ColabのCPU環境で計算実行時間は約7分（GPUは使用していない）。
  checks:
    must_include:
