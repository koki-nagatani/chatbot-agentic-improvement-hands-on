- id: hard-followup-generals-strength
  category: hard
  turns:
    - Generals.ioというゲームのAIを強化学習で作った論文を紹介している記事はありますか？
    - それって結局どれくらい強かったんですか？
  reference: >-
    「それ」はGenerals.ioのSelf-Play RLで学習したAI。公開1v1ランキングで最初の1,000試合に815勝し、論文報告時点で1位に到達した。
    人間1位（shimatetsu）に27勝12敗で勝率69.2%、人間2位（Mithraaaa）に172勝58敗で74.8%、上位2名合計で199勝70敗・勝率約74.0%。
    ルールベースbotや従来の強化学習botには20勝0敗。
  checks:
    must_include:
      - [1位, '815', '69.2', '74.8', '74.0', 約74]
    expected_docs: [generals-io-self-play-rl]
  criteria: [conversation_context]
