- id: normal-claude-code-5-patterns
  category: normal
  turns:
    - Claude Codeを実務で使うときに効いた「5つの型」って何ですか？
  reference: >-
    1) 並列化：git worktreeでモジュールごとに別窓を作って並列開発、
    2) プロンプト運用：Markdownでタスクチケット（プロンプトファイル）を管理、
    3) レビュー自動ループ：subagent + custom slash commandで実装↔レビューを強制ループ、
    4) ナレッジ一元化：module/README.md（CLAUDE.md）で仕様・実装詳細を一元管理、
    5) インストラクション：CLAUDE.md / subagent.mdで従ってくれないことはSkillsに逃がす。
  checks:
    must_include:
      - [worktree, 並列]
      - [Markdown, チケット, プロンプトファイル]
      - [subagent, サブエージェント]
      - [README, ナレッジ]
      - [Skills, スキル]
    expected_docs: [868e0723efa060]
  criteria: [completeness]

- id: normal-vibe-coding
  category: normal
  turns:
    - Vibe Codingを実プロジェクトで通用させるために、どんな工夫をしたと書かれていますか？
  reference: >-
    鍵は「AIが100%の力を出せる問題設定（枠組み作り）」。具体的な手法は3つで、
    ①徹底的なモジュール化、②デザインパターン（FactoryやTemplateなど）の活用、
    ③概念から詳細へ階層を分けた設計書の作成（実装時は関係する設計書だけをAIに渡す）。
    加えて、Claude CodeとGitHub Copilotによる複数AIのクロスレビューと、人間がテストコードや重要な設計判断を確認することが必須とされている。
  checks:
    must_include:
      - [モジュール]
      - [デザインパターン, Factory]
      - [設計書]
    expected_docs: [9827c9d7686a73]
  criteria: [completeness]

- id: normal-skills-vs-notion
  category: normal
  turns:
    - AI Agentに社内知識を教える方法として、Skillsを使うのとNotionを都度検索させるのとでは、どちらが良い結果でしたか？
  reference: >-
    Skillsが最も良かった。項目正解率は社内知識なし33.0%、Notionを都度検索87.3%、Skillsを参照96.0%。
    SkillsはNotionより応答時間が36%短く、平均入力tokenも78%少なかった。
    ただしSkillsでもCritical failure rateは15.6%残り、完全に人間の確認なしで任せられる水準ではない。
  checks:
    must_include:
      - ['96']
      - ['87.3']
    expected_docs: [aad5698672aef3]
  criteria: [completeness]

- id: normal-sandbox-per-tool
  category: normal
  turns:
    - Claude Code、Codex CLI、Claude Desktopは、それぞれどんなサンドボックスの仕組みを使っていますか？
  reference: >-
    Claude Code：サンドボックスはデフォルトでオフで、/sandboxで有効化する。ファイルシステムはmacOSではSeatbelt、
    Linuxではbubblewrapでプロジェクトディレクトリ外へのアクセスをブロックし、ネットワークはネットワーク名前空間で分離する。
    Codex CLI：macOSではSeatbeltでSBPLプロファイルを動的生成する（LinuxではLandlock + seccomp）。
    Claude Desktop / Cowork：macOSではApple Virtualization Frameworkで完全なUbuntu 22.04 LTS VMを起動する（MicroVM）。
  checks:
    must_include:
      - [Seatbelt]
      - [bubblewrap]
      - [Virtualization Framework, VM, 仮想マシン]
    expected_docs: [3ec9d2d39f446b]
  criteria: [completeness]

- id: normal-runpod-cost
  category: normal
  turns:
    - RunPodでGPU代を抑えながらLLMの学習を回すコツを教えてください。
  reference: >-
    ①先にチャージした残高から使うプリペイド方式なので使いすぎが起きにくい、
    ②ストレージ（Network Volume）と計算が分離しているので、データや環境を永続化したままGPUポッドを使い捨てにできる、
    ③学習のときだけGPUポッドを起動し、前処理や結果の解析はCPUポッドで行う、
    ④ポッドの起動・停止をAPIやrunpodctlで自動化し「使ったら止める」を仕組みで担保する。
    結果として学習が走っている時間だけGPU代がかかる形にできる。
  checks:
    must_include:
      - [プリペイド, チャージ, 前払い]
      - [Network Volume, ネットワークボリューム, Volume, ボリューム]
      - [CPU]
      - [API, CLI, runpodctl, 自動化]
    expected_docs: [runpod-cost-optimization_20260724]
  criteria: [completeness]

- id: normal-dpo-batch-size
  category: normal
  turns:
    - DPOで実効バッチサイズが同じなのにlossが一致しない問題、検証の結果どうだったんですか？
  reference: >-
    学習率が小さい（2e-6）とlossの差は小さく、大きい（2e-5）と差が顕著。lr=2e-5ではbfloat16/float16でずれが発生し、
    float32ではほぼ一致したため、勾配累積時の丸め誤差が関係しているとみられる。
    Unsloth不使用でも同様のずれがありUnsloth固有の問題ではない。一方SFTでは同様の現象は起きず、丸め誤差だけが要因とは言い切れず、DPO側の処理にも要因がある可能性がある。
  checks:
    must_include:
      - [丸め誤差]
      - [float32, fp32, FP32]
      - [学習率, learning rate]
    expected_docs: [e405d3de5704fa]
  criteria: [completeness]

- id: normal-lora-variants
  category: normal
  turns:
    - LoRAの派生手法にはどんな種類がありますか？LoRA-Proはどれに当たりますか？
  reference: >-
    派生手法は3つに分類される。スケーリング・学習率調整型（rsLoRA、LoRA+など）、構造変更型（AdaLoRA、DoRAなど）、
    勾配最適化・初期化型（PiSSA、LoRA-GA、LoRA-Proなど）。LoRA-Proは勾配最適化・初期化型に分類され、
    LoRAの勾配をフルファインチューニングの勾配に近づける最適化を行う。
  checks:
    must_include:
      - [スケーリング, 学習率]
      - [構造]
      - [勾配最適化, 初期化]
    expected_docs: [11168509d10eb4]
  criteria: [completeness]

