    - RuffってFlake8と比べて何がいいんですか？
  reference: >-
    主なメリットは2つ。Rust製で動作が高速なことと、LinterとFormatterの両方の機能があること（Flake8+Blackの組み合わせが不要）。
    ただしFlake8の完全上位互換ではないので、既存プロジェクトの置き換えには注意が必要。
  checks:
    must_include:
      - [高速, 速い, 速さ]
      - [Formatter, フォーマッタ, フォーマット, 整形]
    expected_docs: [4e6833e71b267c]
  criteria: [conciseness]

